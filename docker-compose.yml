services:
  xu-api:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - '8000:8000'
    environment:
      APP_ENV: production
      DATABASE_PATH: /data/app.db
      PUBLIC_BASE_URL: http://localhost:8000
      FRONTEND_ORIGIN: http://localhost:8081
      NATIVE_REDIRECT_URIS: nativedemo://auth
      # Enable for the local demo; disable for a public deployment.
      ALLOW_DEMO_AUTH: 'true'
      COOKIE_SECURE: 'false'
      # Optional Google OAuth (backend only; the login page uses email codes):
      # GOOGLE_CLIENT_ID: ...
      # GOOGLE_CLIENT_SECRET: ...
      # Email-code login (read from the shell or a local .env file):
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
    volumes:
      - xu-data:/data

volumes:
  xu-data:
